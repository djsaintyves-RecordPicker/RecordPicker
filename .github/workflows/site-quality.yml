name: Validate public site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile site scripts
        run: python3 -m compileall -q Scripts
      - name: Verify language navigation respects explicit URLs
        run: node Scripts/test_creator_language_navigation.cjs
      - name: Verify campaign attribution and static store links
        run: |
          node Scripts/test_campaign_links.cjs
          PYTHONPATH=Scripts python3 -m unittest Scripts/test_site_campaign_links.py
          python3 Scripts/site_campaign_links.py
      - name: Validate generated pages
        run: |
          python3 Scripts/site_meal_discovery.py
          python3 Scripts/audit_site_quality.py
          python3 Scripts/site_social_identity.py
          python3 Scripts/site_ecosystem_links.py
          python3 Scripts/audit_internal_site_links.py
          python3 Scripts/site_snory_metadata.py
          python3 Scripts/audit_faq_consistency.py
          python3 Scripts/site_app_identity.py
          python3 Scripts/site_guide_identity.py
      - name: Validate canonical and reciprocal language signals
        run: |
          python3 Scripts/site_canonical_policy.py
          PYTHONPATH=Scripts python3 -m unittest Scripts/test_site_canonical_policy.py
      - name: Verify accepted localized copy
        run: python3 Scripts/site_localization_integrity.py
      - name: Test localization integrity tooling
        run: PYTHONPATH=Scripts python3 -m unittest Scripts/test_site_localization_integrity.py
      - name: Test Today Pick editorial fallback
        run: PYTHONPATH=.github/today-pick python3 .github/today-pick/test_collect_today_pick_feed.py
      - name: Validate IndexNow publication batch
        run: python3 Scripts/submit_indexnow.py --dry-run
      - name: Test incremental IndexNow notifications
        run: PYTHONPATH=Scripts python3 -m unittest Scripts/test_submit_indexnow.py
      - name: Validate the current release and staged announcement twice
        run: python3 Scripts/test_release_publication.py
