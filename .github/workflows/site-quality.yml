name: Validate public site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile site scripts
        run: python3 -m compileall -q Scripts
      - name: Validate generated pages
        run: python3 Scripts/audit_site_quality.py
      - name: Simulate the complete 1.9 publication twice
        run: python3 Scripts/test_release_publication.py
